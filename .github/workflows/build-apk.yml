name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build web bundle
        env:
          VITE_SUPABASE_URL:      ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build
      - run: npm install -g @capacitor/cli
      - run: npx cap add android || true
      - run: npx cap sync android
      - run: npx cap sync android
      - run: sed -i 's/JavaVersion\.VERSION_21/JavaVersion.VERSION_17/g' android/app/build.gradle
      - name: Install WebView crash-recovery MainActivity
        run: |
          MAIN=$(find android/app/src/main/java -name MainActivity.java | head -1)
          PKG=$(sed -n 's/^package \(.*\);/\1/p' "$MAIN")
          sed "s/__PACKAGE__/$PKG/" native-android/MainActivity.java > "$MAIN"
          echo "Installed crash-recovery MainActivity at $MAIN (package $PKG)"
          cat "$MAIN"
      - run: chmod +x android/gradlew
      - run: chmod +x android/gradlew
      - run: cd android && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: mage-ascension-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
